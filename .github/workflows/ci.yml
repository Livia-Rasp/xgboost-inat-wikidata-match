name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what development and the container both run, so it is what has to be green.
        # The older two stay to catch skew that a single job would hide.
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # dbt is in here so tests/test_dbt.py actually runs rather than skipping itself: it
        # builds the whole dbt project against the fixture universe, which is the only place
        # milestone 14's SQL is exercised without the 190 MB of caches CI does not have.
        run: pip install -e ".[dev,dbt]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite runs entirely against tests/fixtures/ — no network, and no dependency on
        # data/, which is gitignored and rebuilt locally. Tests that need the full pipeline skip
        # themselves here rather than failing.
        run: pytest

  lock:
    # A pyproject.toml edit that is never re-locked leaves uv.lock describing a dependency set
    # nobody asked for, and the container would keep building the old one indefinitely.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the pipeline image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: pipeline:ci
          # .dockerignore excludes .git/, so tracking.git_sha() cannot derive this in the image.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checks inside the image
        run: docker run --rm pipeline:ci make test lint

      - name: Gold-set evaluation reproduces the committed numbers
        # Spec §7 milestone 13's acceptance check. The grep is the point — a run that prints
        # different numbers is a packaging bug, and a silently passing `make gold` would not
        # catch it.
        #
        # `--network none` enforces the "no network" claim rather than asserting it. It used to be
        # false: score_gold_set -> baseline_predict -> build_observation_counts reached
        # api.inaturalist.org for the 480 taxon ids in a gold exact-match tie, because
        # data/inat_observation_counts.parquet is gitignored and not in the image. So the
        # committed baseline number silently depended on live counts that drift, and this job
        # could fail without a commit. Fixed by tests/fixtures/gold_observation_counts.csv.gz;
        # this flag is what stops it regressing.
        run: |
          docker run --rm --network none pipeline:ci make gold | tee gold.out
          grep -q "263 items, 2,610 candidate rows"       gold.out
          grep -q "Recall ceiling .*: 100.00%"            gold.out
          grep -qE "binary +0\.982609 +0\.990580 +0\.010012" gold.out
          grep -qE "rank +0\.982609 +0\.991304 +0\.008293"   gold.out
          grep -qE "baseline +0\.209125"                  gold.out

      - name: Build the Airflow image
        # Not pushed, and nothing runs on it until milestone 16. This step exists to prove that
        # this project's dependencies still co-resolve with Airflow, Cosmos, dbt and MLflow on a
        # single interpreter — the assumption milestones 14-16 are built on.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.airflow
          load: true
          tags: pipeline-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the pipeline image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/livia-rasp/xgboost-inat-wikidata-match:latest
            ghcr.io/livia-rasp/xgboost-inat-wikidata-match:${{ github.sha }}
          cache-from: type=gha
