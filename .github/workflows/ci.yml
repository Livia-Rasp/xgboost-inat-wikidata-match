name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Development happens on 3.14; these two are what xgboost/shap ship reliable wheels for,
        # and the pair catches version skew that a single job would not.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite runs entirely against tests/fixtures/ — no network, and no dependency on
        # data/, which is gitignored and rebuilt locally. Tests that need the full pipeline skip
        # themselves here rather than failing.
        run: pytest
