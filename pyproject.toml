[project]
name = "xgboost-inat-wikidata-match"
version = "0.1.0"
description = "Record-linkage classifier matching Wikidata taxon items to candidate iNaturalist taxa"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "xgboost>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "rapidfuzz>=3.0",
    "unidecode>=1.3",
    "pyarrow>=14.0",
    "requests>=2.31",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
