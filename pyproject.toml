[project]
name = "xgboost-inat-wikidata-match"
version = "0.1.0"
description = "Record-linkage classifier matching Wikidata taxon items to candidate iNaturalist taxa"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "xgboost>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "rapidfuzz>=3.0",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "shap>=0.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
# The report notebook is a narrative document whose cell outputs are committed and quoted from.
# Linting it would mean reformatting cells, which means re-executing them, which is exactly the
# thing that silently rewrote milestone 1's frozen numbers once already.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # zip() without strict=. Every zip in src/ walks columns of one DataFrame, which are equal
    # length by construction, and the alternative is 21 call sites annotated to say so.
    "B905",
]

# Formatting is deliberately not enforced. `ruff format` would rewrite files this project has
# never had a formatter applied to, burying real changes under whitespace churn; the linting
# above is what actually catches bugs.
